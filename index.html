<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>MOVO — Point of Sale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --black:#0A0A0D;
  --surface:#151519;
  --surface-2:#1D1D24;
  --surface-3:#26262F;
  --border:#2A2A34;
  --white:#FFFFFF;
  --muted:#8C8C9A;
  --muted-2:#5E5E6B;
  --magenta:#E0159C;
  --violet:#6C3CF0;
  --grad: linear-gradient(120deg,#E0159C 0%,#8B2CE0 55%,#6C3CF0 100%);
  --success:#22C55E;
  --danger:#EF4444;
  --warn:#F59E0B;
  --radius:14px;
  --radius-sm:9px;
  --shadow: 0 10px 40px -12px rgba(0,0,0,0.6);
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--black);
  color:var(--white);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{ background:var(--magenta); color:var(--white); }
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:10px;}

h1,h2,h3,.display{ font-family:'Manrope',system-ui,sans-serif; font-weight:800; letter-spacing:-0.02em; }
.mono{ font-family:'JetBrains Mono',monospace; }

a{color:inherit; text-decoration:none;}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,select{ font-family:inherit; color:var(--white); }

/* ---------- Utility ---------- */
.grad-text{
  background:var(--grad);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.chevron{
  display:inline-block; width:0; height:0;
  border-top:7px solid transparent; border-bottom:7px solid transparent;
  border-left:10px solid var(--magenta);
}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600;
  background:var(--surface-3); color:var(--muted);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 20px; border-radius:var(--radius-sm);
  font-weight:700; font-size:14px; transition:transform .15s ease, opacity .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{ background:var(--grad); color:#fff; box-shadow:0 8px 24px -8px rgba(224,21,156,0.5); }
.btn-primary:hover{ opacity:0.92; }
.btn-ghost{ background:var(--surface-2); color:var(--white); border:1px solid var(--border); }
.btn-ghost:hover{ background:var(--surface-3); }
.btn-outline{ background:transparent; border:1px solid var(--border); color:var(--muted); }
.btn-outline:hover{ color:var(--white); border-color:var(--muted-2); }
.btn-danger{ background:rgba(239,68,68,0.12); color:var(--danger); }
.btn-danger:hover{ background:rgba(239,68,68,0.2); }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:8px; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; }
.btn-icon{ width:38px; height:38px; padding:0; border-radius:10px; }

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.field input, .field select{
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; font-size:15px; outline:none; transition:border-color .15s ease, background .15s ease;
}
.field input:focus, .field select:focus{ border-color:var(--magenta); background:var(--surface-3); }
.field input::placeholder{ color:var(--muted-2); }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
}

/* ---------- Loading Screen ---------- */
#loading-screen{
  position:fixed; inset:0; z-index:9999; background:var(--black);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:28px;
  transition:opacity .5s ease, visibility .5s ease;
}
#loading-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.loading-logo{ width:180px; opacity:0; animation:logoIn 1s ease forwards; }
@keyframes logoIn{ from{opacity:0; transform:scale(0.92);} to{opacity:1; transform:scale(1);} }
.loading-track{ width:160px; height:3px; background:var(--surface-3); border-radius:3px; overflow:hidden; position:relative; }
.loading-fill{ position:absolute; inset:0; width:40%; background:var(--grad); border-radius:3px; animation:loadMove 1.1s ease-in-out infinite; }
@keyframes loadMove{ 0%{transform:translateX(-100%);} 100%{transform:translateX(340%);} }
.loading-label{ font-size:12px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }

/* ---------- Header / Nav ---------- */
#app{ min-height:100%; display:flex; flex-direction:column; }
header.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; background:rgba(10,10,13,0.85); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand img{ height:26px; display:block; }
.nav-tabs{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:12px; border:1px solid var(--border); }
.nav-tab{ padding:9px 18px; border-radius:9px; font-size:14px; font-weight:700; color:var(--muted); transition:all .15s ease; }
.nav-tab.active{ background:var(--surface-3); color:var(--white); }
.nav-tab:hover:not(.active){ color:var(--white); }
.header-right{ display:flex; align-items:center; gap:10px; }

main{ flex:1; width:100%; max-width:1180px; margin:0 auto; padding:28px 24px 80px; }

/* discreet admin trigger */
.admin-dot{
  width:9px; height:9px; border-radius:50%; background:var(--surface-3);
  border:1px solid var(--border); opacity:0.55; transition:opacity .2s ease, background .2s ease;
}
.admin-dot:hover{ opacity:1; background:var(--magenta); }

/* ---------- Sales Interface ---------- */
.sales-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start; }
@media (max-width:900px){ .sales-grid{ grid-template-columns:1fr; } }

.section-title{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.section-title h2{ font-size:19px; }
.section-title .chevron{ margin-top:1px; }

.draft-banner{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:linear-gradient(90deg, rgba(224,21,156,0.12), rgba(108,60,240,0.12));
  border:1px solid rgba(139,44,224,0.35); border-radius:12px; padding:12px 16px; margin-bottom:18px;
  font-size:13px; color:#e7c9f4;
}
.draft-banner b{ color:#fff; }

.customer-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
@media (max-width:520px){ .customer-row{ grid-template-columns:1fr; } }

.products-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.product-row{
  display:grid; grid-template-columns:1fr 76px 110px 100px 34px; gap:10px; align-items:end;
  padding:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
}
@media (max-width:640px){
  .product-row{ grid-template-columns:1fr 1fr; grid-template-areas:"name name" "qty price" "sub remove"; }
  .product-row .field-name{ grid-area:name; }
  .product-row .field-qty{ grid-area:qty; }
  .product-row .field-price{ grid-area:price; }
  .product-row .field-sub{ grid-area:sub; }
  .product-row .remove-btn{ grid-area:remove; justify-self:end; }
}
.product-row input{ width:100%; }
.subtotal-display{
  background:var(--surface-3); border-radius:10px; padding:12px 10px; font-size:14px; font-weight:700;
  text-align:right; font-family:'JetBrains Mono',monospace; color:var(--white);
}
.remove-btn{
  width:32px; height:32px; border-radius:8px; background:rgba(239,68,68,0.1); color:var(--danger);
  display:flex; align-items:center; justify-content:center; font-size:16px; align-self:center;
}
.remove-btn:hover{ background:rgba(239,68,68,0.22); }
.add-product-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  border:1.5px dashed var(--border); border-radius:12px; padding:14px; color:var(--muted);
  font-weight:700; font-size:14px; transition:all .15s ease;
}
.add-product-btn:hover{ border-color:var(--magenta); color:var(--white); background:rgba(224,21,156,0.06); }

.summary-card{ padding:22px; position:sticky; top:86px; }
.summary-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-size:14px; color:var(--muted); border-bottom:1px solid var(--border); }
.summary-row:last-of-type{ border-bottom:none; }
.summary-row b{ color:var(--white); font-family:'JetBrains Mono',monospace; }
.summary-total{ display:flex; justify-content:space-between; align-items:baseline; margin:18px 0; }
.summary-total .label{ font-size:13px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
.summary-total .value{ font-size:30px; font-weight:800; font-family:'Manrope',sans-serif; }
.summary-actions{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }

.autosave-indicator{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted-2); margin-top:14px; }
.autosave-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }

/* ---------- History / Table ---------- */
.toolbar{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
.search-input{ flex:1; min-width:220px; }
.table-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
table{ width:100%; border-collapse:collapse; font-size:14px; min-width:640px; }
thead th{
  text-align:left; padding:12px 16px; font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em;
  color:var(--muted); background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{ padding:13px 16px; border-bottom:1px solid var(--border); color:var(--white); white-space:nowrap; }
tbody tr:last-child td{ border-bottom:none; }
tbody tr{ transition:background .15s ease; }
tbody tr:hover{ background:var(--surface-2); }
.row-link{ color:var(--white); font-weight:700; cursor:pointer; }
.row-link:hover{ color:var(--magenta); }
.empty-state{ padding:60px 20px; text-align:center; color:var(--muted); }
.empty-state .chevron{ margin-bottom:14px; }

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,5,7,0.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s ease;
}
.modal-overlay.show{ opacity:1; visibility:visible; }
.modal-box{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  width:100%; max-width:420px; padding:28px; box-shadow:var(--shadow);
  transform:translateY(12px) scale(0.98); transition:transform .2s ease;
}
.modal-overlay.show .modal-box{ transform:translateY(0) scale(1); }
.modal-box.wide{ max-width:640px; }
.modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.modal-close{ width:32px; height:32px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:16px; }
.modal-close:hover{ color:var(--white); background:var(--surface-3); }
.error-text{ color:var(--danger); font-size:13px; margin-top:8px; min-height:16px; }

/* ---------- Invoice ---------- */
#invoice-modal .modal-box{ max-width:460px; padding:0; overflow:hidden; }
.invoice-paper{ background:#fff; color:#111; padding:30px 26px; }
.invoice-paper, .invoice-paper *{ color:#111 !important; }
.invoice-paper .store-meta{ color:#666 !important; }
.invoice-paper .invoice-totals .row, .invoice-paper .invoice-meta-row{ color:#444 !important; }
.invoice-paper .invoice-thanks span{ color:#888 !important; }
.invoice-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.invoice-head img{ height:30px; }
.invoice-head .store-meta{ text-align:right; font-size:11px; color:#666; line-height:1.5; }
.invoice-meta-row{ display:flex; justify-content:space-between; font-size:12.5px; color:#444; padding:10px 0; border-top:1px dashed #ddd; border-bottom:1px dashed #ddd; margin-bottom:16px; }
.invoice-num{ font-family:'JetBrains Mono',monospace; font-weight:700; color:#111; }
.invoice-customer{ font-size:13px; margin-bottom:16px; line-height:1.7; }
.invoice-customer b{ display:block; font-size:14px; }
.invoice-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:14px; }
.invoice-table th{ text-align:left; padding:8px 4px; border-bottom:2px solid #111; font-size:10.5px; text-transform:uppercase; letter-spacing:0.03em; color:#555; }
.invoice-table td{ padding:8px 4px; border-bottom:1px solid #eee; }
.invoice-table td.num, .invoice-table th.num{ text-align:right; }
.invoice-totals{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; margin-bottom:22px; }
.invoice-totals .row{ display:flex; justify-content:space-between; width:220px; font-size:13px; color:#444; }
.invoice-totals .grand{ font-size:19px; font-weight:800; color:#111; border-top:2px solid #111; padding-top:8px; margin-top:4px; width:220px; justify-content:space-between; display:flex; }
.invoice-thanks{ text-align:center; padding-top:14px; border-top:1px dashed #ddd; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; font-size:13px; color:#111; }
.invoice-thanks span{ display:block; font-size:10.5px; font-weight:400; text-transform:none; letter-spacing:normal; color:#888; margin-top:4px; }
.invoice-actions{ display:flex; gap:10px; padding:18px 26px; background:var(--surface-2); }

/* ---------- Admin Dashboard ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
@media (max-width:900px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .stat-grid{ grid-template-columns:1fr; } }
.stat-card{ padding:18px; }
.stat-card .stat-label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:8px; }
.stat-card .stat-value{ font-size:26px; font-weight:800; font-family:'Manrope',sans-serif; }
.stat-card .stat-sub{ font-size:12px; color:var(--muted-2); margin-top:4px; }

.admin-tabs{ display:flex; gap:4px; overflow-x:auto; margin-bottom:20px; border-bottom:1px solid var(--border); }
.admin-tab{ padding:12px 16px; font-size:13.5px; font-weight:700; color:var(--muted); white-space:nowrap; border-bottom:2px solid transparent; }
.admin-tab.active{ color:var(--white); border-bottom-color:var(--magenta); }
.admin-tab:hover:not(.active){ color:var(--white); }

.chart-card{ padding:20px; margin-bottom:20px; }
.chart-card .section-title{ margin-bottom:18px; }
.bars{ display:flex; align-items:flex-end; gap:8px; height:160px; padding-top:10px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.bar{ width:100%; max-width:34px; border-radius:6px 6px 2px 2px; background:var(--grad); min-height:3px; transition:height .4s ease; position:relative; }
.bar-label{ font-size:10.5px; color:var(--muted); white-space:nowrap; }
.bar-value{ font-size:10px; color:var(--muted-2); font-family:'JetBrains Mono',monospace; }

.period-toggle{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:10px; border:1px solid var(--border); }
.period-btn{ padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--muted); }
.period-btn.active{ background:var(--surface-3); color:var(--white); }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:800px){ .two-col{ grid-template-columns:1fr; } }

.rank-list{ display:flex; flex-direction:column; }
.rank-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.rank-item:last-child{ border-bottom:none; }
.rank-num{ width:24px; height:24px; border-radius:7px; background:var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; color:var(--muted); flex-shrink:0; }
.rank-item:nth-child(1) .rank-num{ background:var(--grad); color:#fff; }
.rank-info{ flex:1; min-width:0; }
.rank-name{ font-weight:700; font-size:13.5px; }
.rank-sub{ font-size:11.5px; color:var(--muted); }
.rank-value{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px; }

.login-screen{ min-height:70vh; display:flex; align-items:center; justify-content:center; }
.login-card{ width:100%; max-width:380px; padding:34px 30px; text-align:center; }
.login-card img{ height:34px; margin-bottom:22px; }
.login-card h3{ font-size:18px; margin-bottom:6px; }
.login-card p{ font-size:13px; color:var(--muted); margin-bottom:24px; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--white);
  padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:500;
  box-shadow:var(--shadow); opacity:0; visibility:hidden; transition:all .25s ease;
  display:flex; align-items:center; gap:10px;
}
.toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
.toast .dot{ width:8px; height:8px; border-radius:50%; background:var(--success); }
.toast.error .dot{ background:var(--danger); }

footer.app-footer{ display:flex; align-items:center; justify-content:center; gap:10px; padding:20px; color:var(--muted-2); font-size:11.5px; }

@media print{
  body *{ visibility:hidden; }
  #print-area, #print-area *{ visibility:visible; }
  #print-area{ position:absolute; top:0; left:0; width:100%; }
  .invoice-actions{ display:none !important; }
}
</style>
</head>

/* ============================================================
   STORAGE HELPERS
============================================================ */
async function storageGet(key){
  try{
    const res = await window.storage.get(key, false);
    if(!res) return null;
    return JSON.parse(res.value);
  }catch(e){
    return null;
  }
}
async function storageSet(key, value){
  try{
    await window.storage.set(key, JSON.stringify(value), false);
    return { ok:true };
  }catch(e){
    console.error("storage set failed", key, e);
    return { ok:false, error: (e && e.message) ? e.message : String(e) };
  }
}
async function storageDelete(key){
  try{
    await window.storage.delete(key, false);
  }catch(e){ /* ignore */ }
}

/* ============================================================
   UTIL
============================================================ */
function uid(){ return 'p' + Math.random().toString(36).slice(2,9); }
function invId(){ return 'inv_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function money(n){
  n = Number(n)||0;
  return n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function pad(n,len){ n=String(n); while(n.length<len) n='0'+n; return n; }
function dateKey(d){ return d.getFullYear()+pad(d.getMonth()+1,2)+pad(d.getDate(),2); }
function formatDate(d){
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function formatTime(d){
  return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg, isError){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 2600);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

/* ============================================================
   INVOICE NUMBERING
============================================================ */
async function nextInvoiceNumber(){
  const now = new Date();
  const dk = dateKey(now);
  const seqKey = K_SEQ_PREFIX + dk;
  let seq = await storageGet(seqKey);
  // In-memory fallback keeps numbering correct within this session even if
  // persistent storage is unreachable — avoids duplicate invoice numbers.
  const memSeq = State.seqFallback[dk] || 0;
  seq = (typeof seq === 'number' && !isNaN(seq)) ? Math.max(seq, memSeq) : memSeq;
  seq += 1;
  State.seqFallback[dk] = seq;
  await storageSet(seqKey, seq);
  return `INV-${dk}-${pad(seq,3)}`;
}

/* ============================================================
   DRAFT MODEL
============================================================ */
function blankDraft(){
  return {
    customerName: "",
    customerPhone: "",
    products: [ blankProduct() ],
    updatedAt: Date.now()
  };
}
function blankProduct(){
  return { id: uid(), name: "", qty: "", price: "" };
}
function computeProductSubtotal(p){
  const q = parseFloat(p.qty)||0;
  const pr = parseFloat(p.price)||0;
  return q*pr;
}
function computeDraftTotals(draft){
  let pieces=0, total=0;
  draft.products.forEach(p=>{
    const q = parseFloat(p.qty)||0;
    pieces += q;
    total += computeProductSubtotal(p);
  });
  return { pieces, total };
}

function scheduleDraftSave(){
  clearTimeout(State.draftSaveTimer);
  State.draftSaveTimer = setTimeout(async ()=>{
    if(!State.draft) return;
    State.draft.updatedAt = Date.now();
    await storageSet(K_DRAFT, State.draft);
    const dot = document.getElementById('autosave-dot-label');
    if(dot) dot.textContent = 'Draft saved · ' + formatTime(new Date());
  }, 450);
}

   RENDER: ROOT ROUTER
============================================================ */
function render(){
  document.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.view === State.view);
  });
  const main = document.getElementById('main-content');
  if(State.view === 'sales') main.innerHTML = renderSalesView();
  else if(State.view === 'history') main.innerHTML = renderHistoryView();
  else if(State.view === 'store') main.innerHTML = renderStoreSettingsView();
  else if(State.view === 'admin') main.innerHTML = State.isAdminAuthed ? renderAdminView() : renderAdminLoginPrompt();
  attachViewHandlers();
}

      <button class="remove-btn" data-remove="${p.id}" title="Remove">&times;</button>
    </div>`;
  }).join('');

  return `
    <div class="section-title"><span class="chevron"></span><h2>New Sale</h2></div>
    ${banner}
    <div class="sales-grid">
      <div>
        <div class="card" style="padding:22px; margin-bottom:18px;">
          <div class="customer-row">
            <div class="field">
              <label>Customer Name</label>
              <input type="text" id="customer-name" placeholder="Full name" value="${escapeHtml(State.draft.customerName)}">
            </div>
            <div class="field">
              <label>Phone Number</label>
              <input type="tel" id="customer-phone" placeholder="e.g. 010xxxxxxxx" value="${escapeHtml(State.draft.customerPhone)}">
            </div>
          </div>
          <div class="products-list" id="products-list">${productsHtml}</div>

      </div>

          <div class="summary-row"><span>Items</span><b>${State.draft.products.length}</b></div>

          <div class="autosave-indicator"><span class="autosave-dot"></span><span id="autosave-dot-label">Autosave enabled</span></div>
        </div>

    </div>
  `;

/* ============================================================

============================================================ */
function filteredInvoices(){
  const q = State.historySearch.trim().toLowerCase();
  let list = State.invoices.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(!q) return list;
  return list.filter(inv=>{
    return inv.invoiceNumber.toLowerCase().includes(q) ||
      (inv.customerName||'').toLowerCase().includes(q) ||
      (inv.customerPhone||'').toLowerCase().includes(q) ||
      inv.products.some(p=>(p.name||'').toLowerCase().includes(q));
  });
}

function renderHistoryView(){
  const list = filteredInvoices();
  const rows = list.map(inv=>`
    <tr>
      <td><span class="row-link mono" data-view-invoice="${inv.id}">${inv.invoiceNumber}</span></td>
      <td>${formatDate(new Date(inv.createdAt))} · ${formatTime(new Date(inv.createdAt))}</td>
      <td>${escapeHtml(inv.customerName||'—')}</td>
      <td>${escapeHtml(inv.customerPhone||'—')}</td>
      <td>${inv.totalPieces}</td>
      <td class="mono">${money(inv.grandTotal)}</td>
    </tr>
  `).join('');

  const table = list.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th>Phone</th><th>Pieces</th><th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : `
    <div class="card empty-state">
      <div class="chevron" style="margin:0 auto 14px; transform:scale(1.4);"></div>
      <div>No invoices yet — completed sales will show up here.</div>

/* ============================================================
   ANALYTICS HELPERS
============================================================ */
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function computeStats(){
  const invoices = State.invoices;
  const totalRevenue = invoices.reduce((s,i)=>s+i.grandTotal,0);
  const totalInvoices = invoices.length;
  const totalPieces = invoices.reduce((s,i)=>s+i.totalPieces,0);
  const avgOrder = totalInvoices ? totalRevenue/totalInvoices : 0;
  const today = new Date();
  const todayRevenue = invoices.filter(i=>isSameDay(new Date(i.createdAt), today)).reduce((s,i)=>s+i.grandTotal,0);
  return { totalRevenue, totalInvoices, totalPieces, avgOrder, todayRevenue };
}

function computeCustomers(){
  const map = {};
  State.invoices.forEach(inv=>{
    const key = (inv.customerPhone||inv.customerName||'unknown').trim() || 'unknown';
    if(!map[key]) map[key] = { name: inv.customerName||'Unknown', phone: inv.customerPhone||'—', total:0, orders:0, lastDate:0, invoices:[] };
    map[key].total += inv.grandTotal;
    map[key].orders += 1;
    map[key].lastDate = Math.max(map[key].lastDate, inv.createdAt);
    map[key].invoices.push(inv);
    if(inv.customerName) map[key].name = inv.customerName;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function computeProductPerformance(){
  const map = {};
  State.invoices.forEach(inv=>{
    inv.products.forEach(p=>{
      const key = (p.name||'Unnamed').trim().toLowerCase() || 'unnamed';
      if(!map[key]) map[key] = { name: p.name||'Unnamed', qty:0, revenue:0 };
      const q = parseFloat(p.qty)||0;
      map[key].qty += q;
      map[key].revenue += q*(parseFloat(p.price)||0);
    });
  });
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue);
}

function computePeriodSeries(period){
  const buckets = {};
  const order = [];
  function bucketKey(d){
    if(period==='daily') return dateKey(d);
    if(period==='weekly'){
      const onejan = new Date(d.getFullYear(),0,1);
      const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
      return d.getFullYear()+'-W'+pad(week,2);
    }
    return d.getFullYear()+'-'+pad(d.getMonth()+1,2);
  }
  function bucketLabel(d){
    if(period==='daily') return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    if(period==='weekly') return 'Wk ' + bucketKey(d).split('-W')[1];
    return d.toLocaleDateString(undefined,{month:'short', year:'2-digit'});
  }
  State.invoices.forEach(inv=>{
    const d = new Date(inv.createdAt);
    const key = bucketKey(d);
    if(!buckets[key]){ buckets[key] = { key, label: bucketLabel(d), value:0, sortD: d }; order.push(key); }
    buckets[key].value += inv.grandTotal;
  });
  const arr = Object.values(buckets).sort((a,b)=>a.sortD-b.sortD);
  return arr.slice(-12);
}

function downloadInvoice(inv){
  const styleTag = document.querySelector('style').innerHTML;
  let invoiceCss = '';
  try{
    invoiceCss = styleTag.split('/* ---------- Invoice ---------- */')[1].split('/* ---------- Admin')[0];
  }catch(e){ invoiceCss = ''; }
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${inv.invoiceNumber}</title>
  <style>
  body{font-family:'JetBrains Mono',monospace,Arial,sans-serif; padding:0; margin:0; background:#f4f4f4;}
  ${invoiceCss}
  .invoice-paper{max-width:460px; margin:24px auto; box-shadow:0 4px 24px rgba(0,0,0,0.12);}
  </style></head><body><div class="invoice-paper">${invoicePaperHtml(inv)}</div>
  <div style="text-align:center; padding:16px; font-family:Arial,sans-serif; font-size:12px; color:#888;">
    Use your browser's menu (⋮ or Ctrl/Cmd+S) to save this page, or Ctrl/Cmd+P to save as PDF.
  </div>
  </body></html>`;

  // Sandboxed iframes block the <a download> attribute, so open the invoice
  // in a new tab instead — the user can save it from there (Ctrl/Cmd+S or Print > Save as PDF).
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const win = window.open(url, '_blank');
  if(!win){
    // Popup blocked — fall back to a data URL the user can long-press / right-click to save.
    showToast('المتصفح منع فتح نافذة جديدة — اسمح بالنوافذ المنبثقة (popups) وجرّب تاني.', true);
  }else{
    showToast('اتفتحت الفاتورة في تاب جديد — احفظها من هناك (Ctrl/Cmd+S) أو اطبعها PDF.');
  }
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
}

/* ============================================================
   EXCEL EXPORT
============================================================ */
function exportExcel(){
  if(typeof XLSX === 'undefined'){ showToast('Excel library failed to load — check your connection.', true); return; }
  const wb = XLSX.utils.book_new();

  const invRows = State.invoices.slice().sort((a,b)=>a.createdAt-b.createdAt).map(inv=>({
    'Invoice Number': inv.invoiceNumber,
    'Date': formatDate(new Date(inv.createdAt)),
    'Time': formatTime(new Date(inv.createdAt)),
    'Customer Name': inv.customerName,
    'Customer Phone': inv.customerPhone,
    'Total Pieces': inv.totalPieces,
    'Grand Total': inv.grandTotal
  }));
  const wsInv = XLSX.utils.json_to_sheet(invRows);
  XLSX.utils.book_append_sheet(wb, wsInv, 'Invoices');

  const lineRows = [];
  State.invoices.forEach(inv=>{
    inv.products.forEach(p=>{
      lineRows.push({
        'Invoice Number': inv.invoiceNumber,
        'Date': formatDate(new Date(inv.createdAt)),
        'Customer Name': inv.customerName,
        'Product': p.name,
        'Quantity': p.qty,
        'Unit Price': p.price,
        'Subtotal': computeProductSubtotal(p)
      });
    });
  });
  const wsLines = XLSX.utils.json_to_sheet(lineRows);
  XLSX.utils.book_append_sheet(wb, wsLines, 'Sale Line Items');

  const custRows = computeCustomers().map(c=>({
    'Customer Name': c.name, 'Phone': c.phone, 'Orders': c.orders,
    'Total Spent': c.total, 'Last Purchase': formatDate(new Date(c.lastDate))
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custRows), 'Customers');

  const prodRows = computeProductPerformance().map(p=>({
    'Product': p.name, 'Units Sold': p.qty, 'Revenue': p.revenue
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows), 'Product Performance');

  const stats = computeStats();
  const summaryRows = [
    { Metric:'Total Revenue', Value: stats.totalRevenue },
    { Metric:"Today's Revenue", Value: stats.todayRevenue },
    { Metric:'Total Invoices', Value: stats.totalInvoices },
    { Metric:'Total Pieces Sold', Value: stats.totalPieces },
    { Metric:'Average Order Value', Value: stats.avgOrder }
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Summary');

  const fname = `MOVO-Export-${dateKey(new Date())}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast('Excel file exported.');
}

function attachViewHandlers(){

function attachSalesHandlers(){
  const dismissBtn = document.getElementById('dismiss-draft-banner');
  if(dismissBtn) dismissBtn.addEventListener('click', ()=>{ State.draftRestoredNotice=false; render(); });

  document.getElementById('customer-name').addEventListener('input', e=>{
    State.draft.customerName = e.target.value; scheduleDraftSave();
  });
  document.getElementById('customer-phone').addEventListener('input', e=>{
    State.draft.customerPhone = e.target.value; scheduleDraftSave();
  });

  document.querySelectorAll('.product-row').forEach(row=>{
    const pid = row.dataset.pid;
    const prod = State.draft.products.find(p=>p.id===pid);
    row.querySelector('.prod-name').addEventListener('input', e=>{ prod.name = e.target.value; scheduleDraftSave(); });
    row.querySelector('.prod-qty').addEventListener('input', e=>{ prod.qty = e.target.value; updateProductSubtotalDisplay(row, prod); updateSummaryOnly(); scheduleDraftSave(); });
    row.querySelector('.prod-price').addEventListener('input', e=>{ prod.price = e.target.value; updateProductSubtotalDisplay(row, prod); updateSummaryOnly(); scheduleDraftSave(); });
    const rm = row.querySelector('.remove-btn');
    if(rm) rm.addEventListener('click', ()=>{
      if(State.draft.products.length<=1){ showToast('At least one product line is required.', true); return; }
      State.draft.products = State.draft.products.filter(p=>p.id!==pid);
      scheduleDraftSave();
      render();
    });
  });

  document.getElementById('add-product-btn').addEventListener('click', ()=>{
    State.draft.products.push(blankProduct());
    scheduleDraftSave();
    render();
  });

  document.getElementById('complete-sale-btn').addEventListener('click', completeSale);
  document.getElementById('new-sale-btn').addEventListener('click', async ()=>{
    if(!confirm('Discard the current unsaved sale and start a new one?')) return;
    State.draft = blankDraft();
    State.draftRestoredNotice = false;
    await storageDelete(K_DRAFT);
    render();
    showToast('Started a new sale.');
  });
}

function updateProductSubtotalDisplay(row, prod){
  row.querySelector('.subtotal-display').textContent = money(computeProductSubtotal(prod));
}
function updateSummaryOnly(){
  const totals = computeDraftTotals(State.draft);
  const summaryCard = document.querySelector('.summary-card');
  if(!summaryCard) return;
  summaryCard.querySelectorAll('.summary-row b')[0].textContent = State.draft.products.length;
  summaryCard.querySelectorAll('.summary-row b')[1].textContent = totals.pieces;
  summaryCard.querySelector('.summary-total .value').textContent = money(totals.total);
}

function syncDraftFromDOM(){
  // Read the live form values directly before validating/saving, so the sale
  // never gets blocked by a stale State copy (e.g. autofill or timing edge cases).
  const nameEl = document.getElementById('customer-name');
  if(nameEl) State.draft.customerName = nameEl.value;
  const phoneEl = document.getElementById('customer-phone');
  if(phoneEl) State.draft.customerPhone = phoneEl.value;
  document.querySelectorAll('.product-row').forEach(row=>{
    const pid = row.dataset.pid;
    const prod = State.draft.products.find(p=>p.id===pid);
    if(!prod) return;
    const nameField = row.querySelector('.prod-name');
    const qtyField = row.querySelector('.prod-qty');
    const priceField = row.querySelector('.prod-price');
    if(nameField) prod.name = nameField.value;
    if(qtyField) prod.qty = qtyField.value;
    if(priceField) prod.price = priceField.value;
  });
}

async function completeSale(){
  syncDraftFromDOM();
  const draft = State.draft;
  if(!draft.customerName.trim()){ showToast('Please enter a customer name.', true); document.getElementById('customer-name').focus(); return; }
  const validProducts = draft.products.filter(p=> p.name.trim() && (parseFloat(p.qty)>0) && (parseFloat(p.price)>=0));
  if(!validProducts.length){ showToast('Add at least one product with a name and quantity.', true); return; }

  const totals = computeDraftTotals({products:validProducts});
  const invoiceNumber = await nextInvoiceNumber();
  const now = Date.now();
  const invoice = {
    id: invId(),
    invoiceNumber,
    customerName: draft.customerName.trim(),
    customerPhone: draft.customerPhone.trim(),
    products: validProducts.map(p=>({ name:p.name.trim(), qty: parseFloat(p.qty)||0, price: parseFloat(p.price)||0 })),
    totalPieces: totals.pieces,
    grandTotal: totals.total,
    createdAt: now
  };
  State.invoices.push(invoice);
  const result = await storageSet(K_INVOICES, State.invoices);

  State.draft = blankDraft();
  await storageDelete(K_DRAFT);
  State.draftRestoredNotice = false;
  render();
  showInvoiceModal(invoice.id);

  if(result.ok){
    showToast('Invoice ' + invoiceNumber + ' saved.');
  }else{
    // Keep the sale in this session even if persistent storage failed, so the
    // employee is never blocked from working — just warn clearly.
    State.storageAvailable = false;
    console.error('Persistent storage unavailable:', result.error);
    showToast('الفاتورة ' + invoiceNumber + ' اتحفظت مؤقتًا بس التخزين الدائم مش شغال دلوقتي — لو قفلت الصفحة ممكن تضيع.', true);
  }
}

function attachHistoryHandlers(){
  const search = document.getElementById('history-search');
  search.addEventListener('input', e=>{ State.historySearch = e.target.value; render(); });
  search.focus();
  search.selectionStart = search.value.length;
  document.querySelectorAll('[data-view-invoice]').forEach(el=>{
    el.addEventListener('click', ()=> showInvoiceModal(el.dataset.viewInvoice));
  });
  document.getElementById('export-excel-btn-history')?.addEventListener('click', exportExcel);
}

function attachAdminHandlers(){
  document.getElementById('open-admin-login')?.addEventListener('click', ()=> openModal('admin-login-modal'));
  document.getElementById('change-password-btn')?.addEventListener('click', ()=> openModal('change-password-modal'));
  document.getElementById('admin-logout-btn')?.addEventListener('click', ()=>{
    State.isAdminAuthed = false; State.view='sales'; render(); showToast('Dashboard locked.');
  });
  document.querySelectorAll('[data-admin-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ State.adminTab = btn.dataset.adminTab; render(); });
  });
  document.querySelectorAll('[data-period]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ State.adminPeriod = btn.dataset.period; render(); });
  });
  document.getElementById('export-excel-btn')?.addEventListener('click', exportExcel);
  document.getElementById('export-excel-btn-header')?.addEventListener('click', exportExcel);
  const adminSearch = document.getElementById('admin-history-search');
  if(adminSearch){
    adminSearch.addEventListener('input', e=>{ State.historySearch = e.target.value; render(); });
  }
  document.querySelectorAll('[data-view-invoice]').forEach(el=>{
    el.addEventListener('click', ()=> showInvoiceModal(el.dataset.viewInvoice));
  });
}

/* ============================================================
   GLOBAL / STATIC HANDLERS
============================================================ */
function attachStaticHandlers(){
  document.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ State.view = btn.dataset.view; render(); });
  });

  document.getElementById('admin-trigger').addEventListener('click', ()=>{
    if(State.isAdminAuthed){ State.view='admin'; render(); }
    else{ openModal('admin-login-modal'); }
  });

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click', ()=> closeModal(btn.dataset.close));
  });

  document.getElementById('admin-login-submit').addEventListener('click', submitAdminLogin);
  document.getElementById('admin-password-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAdminLogin(); });

  document.getElementById('change-password-submit').addEventListener('click', submitChangePassword);

  document.getElementById('invoice-close-btn').addEventListener('click', ()=> closeModal('invoice-modal'));
  document.getElementById('invoice-print-btn').addEventListener('click', ()=> window.print());
  document.getElementById('invoice-download-btn').addEventListener('click', ()=>{
    const inv = State.invoices.find(i=>i.id===State.viewingInvoiceId);
    if(inv) downloadInvoice(inv);
  });

  document.querySelectorAll('.modal-overlay').forEach(ov=>{
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.classList.remove('show'); });
  });
}

async function submitAdminLogin(){
  const input = document.getElementById('admin-password-input');
  const errEl = document.getElementById('admin-login-error');
  if(input.value === State.adminPassword){
    State.isAdminAuthed = true;
    input.value = '';
    errEl.textContent = '';
    closeModal('admin-login-modal');
    State.view = 'admin';
    render();
    showToast('Admin dashboard unlocked.');
  }else{
    errEl.textContent = 'Incorrect password. Try again.';
  }
}

async function submitChangePassword(){
  const cur = document.getElementById('current-password-input');
  const nw = document.getElementById('new-password-input');
  const cf = document.getElementById('confirm-password-input');
  const errEl = document.getElementById('change-password-error');
  if(cur.value !== State.adminPassword){ errEl.textContent = 'Current password is incorrect.'; return; }
  if(nw.value.length < 6){ errEl.textContent = 'New password must be at least 6 characters.'; return; }
  if(nw.value !== cf.value){ errEl.textContent = 'New password and confirmation do not match.'; return; }
  State.adminPassword = nw.value;
  await storageSet(K_ADMIN_PW, State.adminPassword);
  cur.value=''; nw.value=''; cf.value=''; errEl.textContent='';
  closeModal('change-password-modal');
  showToast('Admin password updated.');
}

/* ============================================================
   STORE SETTINGS (per-client branding: logo + store name)
============================================================ */
function refreshBrandingDOM(){
  const loadingImg = document.getElementById('loading-logo-img');
  if(loadingImg) loadingImg.src = State.storeLogo;
  const topbarImg = document.getElementById('topbar-logo-img');
  if(topbarImg) topbarImg.src = State.storeLogo;
  document.title = State.storeName + ' — Point of Sale';
}

function attachStoreSettingsHandlers(){
  State.pendingLogoDataUri = null;
  document.getElementById('store-logo-input').addEventListener('change', handleStoreLogoFileChange);
  document.getElementById('store-settings-save').addEventListener('click', saveStoreSettings);
  document.getElementById('store-settings-reset').addEventListener('click', resetStoreSettings);
}

function handleStoreLogoFileChange(e){
  const file = e.target.files && e.target.files[0];
  const errEl = document.getElementById('store-settings-error');
  errEl.textContent = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){
    errEl.textContent = 'Please choose an image file.';
    e.target.value = '';
    return;
  }
  if(file.size > MAX_LOGO_FILE_BYTES){
    errEl.textContent = 'Logo file is too large — please choose an image under 2MB.';
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    State.pendingLogoDataUri = ev.target.result;
    document.getElementById('store-logo-preview').src = State.pendingLogoDataUri;
  };
  reader.onerror = function(){
    errEl.textContent = 'Could not read that image — please try another file.';
  };
  reader.readAsDataURL(file);
}

async function saveStoreSettings(){
  const nameInput = document.getElementById('store-name-input');
  const errEl = document.getElementById('store-settings-error');
  const newName = nameInput.value.trim();
  if(!newName){ errEl.textContent = 'Please enter a store name.'; return; }

  State.storeName = newName;
  if(State.pendingLogoDataUri) State.storeLogo = State.pendingLogoDataUri;
  State.pendingLogoDataUri = null;

  const result = await storageSet(K_STORE_SETTINGS, { storeName: State.storeName, storeLogo: State.storeLogo });
  refreshBrandingDOM();
  render();
  if(result.ok){
    showToast('Store settings saved.');
  }else{
    showToast('Saved for this session, but could not sync to persistent storage.', true);
  }
}

async function resetStoreSettings(){
  State.storeName = DEFAULT_STORE_NAME;
  State.storeLogo = DEFAULT_LOGO_SRC;
  State.pendingLogoDataUri = null;
  await storageDelete(K_STORE_SETTINGS);
  refreshBrandingDOM();
  render();
  showToast('Store settings reset to default.');
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  const storedInvoices = await storageGet(K_INVOICES);
  State.invoices = Array.isArray(storedInvoices) ? storedInvoices : [];

  const storedPw = await storageGet(K_ADMIN_PW);
  if(typeof storedPw === 'string' && storedPw.length){
    State.adminPassword = storedPw;
  }else{
    State.adminPassword = DEFAULT_ADMIN_PASSWORD;
    await storageSet(K_ADMIN_PW, DEFAULT_ADMIN_PASSWORD);
  }

  const storedBranding = await storageGet(K_STORE_SETTINGS);
  if(storedBranding && typeof storedBranding === 'object'){
    if(typeof storedBranding.storeName === 'string' && storedBranding.storeName.trim()) State.storeName = storedBranding.storeName;
    if(typeof storedBranding.storeLogo === 'string' && storedBranding.storeLogo.startsWith('data:image/')) State.storeLogo = storedBranding.storeLogo;
  }
  refreshBrandingDOM();

  const storedDraft = await storageGet(K_DRAFT);
  if(storedDraft && storedDraft.customerName !== undefined){
    const hasContent = (storedDraft.customerName && storedDraft.customerName.trim()) ||
                        (storedDraft.customerPhone && storedDraft.customerPhone.trim()) ||
                        (storedDraft.products||[]).some(p=>p.name||p.qty||p.price);
    State.draft = storedDraft;
    if(!State.draft.products || !State.draft.products.length) State.draft.products = [blankProduct()];
    State.draftRestoredNotice = !!hasContent;
  }else{
    State.draft = blankDraft();
  }

  attachStaticHandlers();
  render();

  document.getElementById('loading-screen').classList.add('hide');
  document.getElementById('app').style.display = 'flex';
  document.getElementById('app').style.flexDirection = 'column';
}

window.addEventListener('DOMContentLoaded', init);

})();
</script>
